# General posting schedule
schedule:
  interval_days: 2
  # local time of day the pipeline runs (server timezone)
  time: "10:00"
  timezone: "Asia/Tashkent"

# Every Nth scheduled post is a poll instead of a text+image post.
# Set to 0 to disable automatic polls (still available via /poll command).
poll_every_n_posts: 4

# Sources to collect news/data from
sources:
  web:
    - name: buxgalter_uz
      type: buxgalter
      url: "https://buxgalter.uz/publish/group4611_novosti"
    - name: soliq_uz
      type: soliq
      api_url: "https://my.soliq.uz/api/main-api/news/search"
      file_url: "https://my.soliq.uz/api/main-api/news/get/file/{file_name}?type=1"
      page_size: 10

  telegram:
    - "soliqnews"
    - "uz_buxgalter"
    - "bank_kuni"

# How many source items to fetch/consider per pipeline run
max_items_per_source: 5

# Post text generation
ai:
  text_model: "claude-sonnet-5"
  image_model: "gpt-image-1"
  image_size: "1024x1024"
  # style guidance passed to Claude when rewriting a news item into a post
  post_style: >
    Пиши на узбекском языке (лотин ёзувида / latin alphabet, o'zbek tilida) в
    стиле экспертного Telegram-канала про бухгалтерию, налоги и финансы
    Узбекистана. Короткие абзацы (1-2 предложения), без воды.

    Структура поста:
    1. Первая строка — жирный заголовок-крючок: короткая фраза, цепляющая
       вопросом или фактом (тег <b>...</b>).
    2. 1-2 коротких абзаца, вводящих в суть новости простым языком.
    3. Если в новости есть ключевой факт, определение, цифра, срок или список
       условий — вынеси это в блок <blockquote>...</blockquote>. Внутри блока
       можно использовать список из 2-4 пунктов через "• " на отдельных строках.
    4. Короткий поясняющий абзац после блока-цитаты (что это значит на практике).
    5. Заключительная строка с эмодзи-маркером (📌 ⚡️ 💬 🔔 ✅ — выбери один
       подходящий по смыслу) и коротким выводом: что делать или на что обратить
       внимание.

    Используй релевантные эмодзи как визуальные маркеры, не больше 3-4 на весь
    пост. Тон деловой и экспертный, БЕЗ продающих призывов и фраз про срочность
    вроде "успей записаться" — это новостной, а не рекламный канал. В конце можно
    добавить 2-3 релевантных хэштега на отдельной строке.
  # style/color guidance passed to the image model for every generated picture
  image_style: >
    High-end poster / key-visual design, like a premium tech startup announcement
    graphic. Near-black background (#262626 / #1a1a1a), dramatic single-source
    studio lighting, one bold 3D-rendered hero object floating in frame — this
    can be a stylized 3D person (e.g. an accountant/office worker rendered as a
    smooth clay/plastic-look 3D character, not a flat silhouette) and/or a 3D
    laptop/device, OR a symbolic object (a glowing badge, a stamped document, a
    coin, a shield, a checkmark seal, a gauge) — pick whatever fits the news
    topic best. The hero object must always be a rendered 3D form with real
    volume, shading and depth (like a Pixar/Cinema4D render), never a flat
    vector icon or silhouette. Strong lime-green glow (#D2FF28) as rim light or
    emissive accent, plus dark gray (#444444) secondary surfaces. Cinematic depth
    of field, soft shadows, subtle grid or particle texture in the background.
    Strictly AVOID: flat vector clipart, generic icon-style illustrations, flat
    silhouettes, or any stock-icon-set look. No text, no letters, no numbers,
    no logos, no watermarks.
